# Use GPU for rendering (Wayland native)
vo=gpu
gpu-context=wayland
hwdec=vaapi-copy
ao=pipewire

# Fix frame pacing issues (common on Hyprland/Wayland)
video-sync=display-resample
interpolation
tscale=oversample

# Force 1080p to stop network/high-res lagging
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"

# Large buffer for YouTube streams
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M

# Specifically for streams
demuxer-readahead-secs=5
